<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Video Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#21253a; --border:#2e3350;
  --accent:#5b8cf7; --accent2:#7c6af7;
  --text:#e2e6f0; --text2:#8a90aa; --text3:#555b75;
  --radius:10px; --sidebar-w:280px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}

/* ── Sidebar ── */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s,min-width .25s;}
#sidebar.collapsed{width:0;min-width:0;}

.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sidebar-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;}
.sidebar-sub{font-size:11px;color:var(--text2);white-space:nowrap;}

.search-wrap{padding:10px 10px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 11px;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}

#list{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.list-item{border-radius:8px;padding:9px 11px;cursor:pointer;margin-bottom:2px;transition:background .12s;display:flex;align-items:flex-start;gap:9px;border:1px solid transparent;}
.list-item:hover{background:var(--surface2);}
.list-item.active{background:rgba(91,140,247,.15);border-color:rgba(91,140,247,.3);}
.item-num{font-size:10px;color:var(--text3);font-family:var(--mono);padding-top:2px;min-width:18px;text-align:right;flex-shrink:0;}
.item-label{font-size:13px;line-height:1.45;color:var(--text);word-break:keep-all;}
.list-item.active .item-label{color:#a8c2ff;}
.item-vid{font-size:10px;color:var(--accent);margin-top:2px;}

.sidebar-footer{padding:9px 12px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.footer-count{font-size:11px;color:var(--text3);}
#reload-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .15s;font-family:var(--font);}
#reload-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#toggle-btn{background:none;border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
#toggle-btn:hover{border-color:var(--accent);color:var(--accent);}
#current-title{font-size:14px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tab-group{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;flex-shrink:0;}
.tab-btn{background:none;border:none;border-radius:6px;padding:5px 11px;font-size:12px;font-family:var(--font);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;font-weight:500;}

/* ── Content ── */
#content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}

#video-panel{flex-shrink:0;background:#000;position:relative;}
#video-panel.hidden{display:none;}
#yt-wrap{width:100%;padding-top:56.25%;position:relative;background:#000;}
#yt-frame{position:absolute;inset:0;width:100%;height:100%;border:none;}

#resize-handle{height:5px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#resize-handle:hover{background:var(--surface2);}
#resize-handle::after{content:'';width:28px;height:3px;border-radius:2px;background:var(--border);}
#resize-handle.hidden{display:none;}

#notes-panel{flex:1;overflow-y:auto;padding:28px 36px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;line-height:1.8;}
#notes-panel.hidden{display:none;}

/* Markdown */
#notes-panel h1{font-size:1.55em;font-weight:700;margin:0 0 16px;color:#c8d8ff;border-bottom:1px solid var(--border);padding-bottom:8px;}
#notes-panel h2{font-size:1.2em;font-weight:600;margin:26px 0 10px;color:#b0c4ff;}
#notes-panel h3{font-size:1.02em;font-weight:600;margin:18px 0 7px;color:#a8b8f0;}
#notes-panel p{margin:0 0 12px;color:var(--text);}
#notes-panel ul,#notes-panel ol{margin:0 0 12px 20px;}
#notes-panel li{margin-bottom:5px;}
#notes-panel code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:.87em;padding:1px 5px;color:#b8d8f8;}
#notes-panel pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 16px;}
#notes-panel pre code{background:none;border:none;padding:0;}
#notes-panel blockquote{border-left:3px solid var(--accent);margin:0 0 12px;padding:5px 0 5px 16px;color:var(--text2);font-style:italic;}
#notes-panel table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:.92em;}
#notes-panel th,#notes-panel td{border:1px solid var(--border);padding:7px 11px;text-align:left;}
#notes-panel th{background:var(--surface2);color:#b0c4ff;font-weight:600;}
#notes-panel tr:hover td{background:rgba(255,255,255,.02);}
#notes-panel hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
#notes-panel a{color:var(--accent);text-decoration:none;}
#notes-panel a:hover{text-decoration:underline;}
#notes-panel strong{font-weight:600;color:#d4e0ff;}

/* Placeholder / Loading */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3);text-align:center;padding:40px;}
.placeholder-icon{font-size:44px;opacity:.4;}
.placeholder h3{font-size:16px;font-weight:500;color:var(--text2);}
.placeholder p{font-size:13px;line-height:1.6;max-width:320px;}

#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;}
.loader{width:36px;height:36px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-size:15px;font-weight:600;color:var(--text);}
.load-sub{font-size:13px;color:var(--text2);}
#retry-btn{display:none;margin-top:4px;padding:10px 24px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);}

.empty-list{padding:20px 14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6;}

@media(max-width:640px){
  :root{--sidebar-w:100vw;}
  #sidebar{position:fixed;z-index:50;bottom:0;top:auto;height:52vh;width:100vw;min-width:100vw;border-right:none;border-top:1px solid var(--border);}
  #sidebar.collapsed{height:0;min-width:0;width:0;}
  #notes-panel{padding:16px 18px;}
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay">
  <div class="loader"></div>
  <div class="load-title">ESL Video Notes</div>
  <div class="load-sub" id="load-msg">Google Sheets에서 불러오는 중…</div>
  <button id="retry-btn" onclick="loadData()">🔄 다시 시도</button>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo">🎬</div>
    <div>
      <div class="sidebar-title">ESL Video Notes</div>
      <div class="sidebar-sub" id="item-count">불러오는 중…</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="검색…" autocomplete="off">
  </div>
  <div id="list"><div class="empty-list">불러오는 중…</div></div>
  <div class="sidebar-footer">
    <span class="footer-count" id="footer-count"></span>
    <button id="reload-btn" onclick="loadData()">🔄 새로고침</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <button id="toggle-btn" title="사이드바 토글" onclick="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="1" y1="3" x2="13" y2="3"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="11" x2="13" y2="11"/>
      </svg>
    </button>
    <div id="current-title">항목을 선택하세요</div>
    <div class="tab-group">
      <button class="tab-btn active" data-mode="both">영상+노트</button>
      <button class="tab-btn" data-mode="video">영상만</button>
      <button class="tab-btn" data-mode="note">노트만</button>
    </div>
  </div>

  <div id="content-area">
    <div id="video-panel" class="hidden">
      <div id="yt-wrap">
        <iframe id="yt-frame" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
    </div>
    <div id="resize-handle" class="hidden"></div>
    <div id="notes-panel">
      <div class="placeholder">
        <div class="placeholder-icon">📋</div>
        <h3>항목을 선택하세요</h3>
        <p>좌측 목록에서 강의를 선택하면 영상과 노트가 표시됩니다.</p>
      </div>
    </div>
  </div>
</div>

<script>
const SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQlEaEIaiAMhCcEAsxlTV_CKEOzEaTlNBNeE80gBaxHhsrFQ1LdM-oJod1Hq_N-qjF2a1TxvDCHAOlK/pub?gid=0&single=true&output=csv";

let items = [];
let activeIdx = -1;
let displayMode = 'both';
let sidebarOpen = true;
let videoPct = 56.25;

// ── RFC 4180 CSV 파서 (index.html 방식 그대로) ──
function parseCSV(t) {
  t = t.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rows = [];
  let cur = [], cell = '', inQ = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i], nx = t[i+1];
    if (inQ) {
      if (ch === '"' && nx === '"') { cell += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cell += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { cur.push(cell); cell = ''; }
      else if (ch === '\n') {
        cur.push(cell); cell = '';
        if (cur.some(c => c)) rows.push(cur);
        cur = [];
      } else { cell += ch; }
    }
  }
  cur.push(cell);
  if (cur.some(c => c)) rows.push(cur);
  if (!rows.length) return [];
  const h = rows[0].map(k => k.trim().toLowerCase());
  const r = [];
  for (let i = 1; i < rows.length; i++) {
    const o = {};
    h.forEach((k, j) => o[k] = rows[i][j] || '');
    r.push(o);
  }
  return r;
}

// ── 데이터 로드 ──
async function loadData() {
  const overlay = document.getElementById('loading-overlay');
  const msg = document.getElementById('load-msg');
  const retryBtn = document.getElementById('retry-btn');
  overlay.style.display = 'flex';
  retryBtn.style.display = 'none';
  msg.textContent = 'Google Sheets에서 불러오는 중…';
  try {
    const resp = await fetch(SHEETS_URL + '&t=' + Date.now());
    if (!resp.ok) throw new Error('응답 오류 ' + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('데이터 없음');
    // Title, Vid, Note 컬럼 (소문자로 파싱됨)
    items = rows.filter(r => r.title).map(r => ({
      title: r.title.trim(),
      vid:   (r.vid || '').trim(),
      note:  (r.note || '').trim()
    }));
    if (!items.length) throw new Error('유효한 항목 없음');
    document.getElementById('item-count').textContent = items.length + '개 강의';
    document.getElementById('footer-count').textContent = items.length + '개';
    renderList();
    overlay.style.display = 'none';
  } catch(e) {
    msg.textContent = '❌ 불러오기 실패: ' + e.message;
    retryBtn.style.display = 'block';
  }
}

// ── 목록 렌더 ──
function renderList(filter = '') {
  const list = document.getElementById('list');
  const q = filter.toLowerCase();
  const visible = items.map((it, i) => ({it, i})).filter(({it}) => it.title.toLowerCase().includes(q));
  if (!visible.length) {
    list.innerHTML = `<div class="empty-list">${filter ? '검색 결과 없음' : '항목이 없습니다.'}</div>`;
    return;
  }
  list.innerHTML = visible.map(({it, i}) => `
    <div class="list-item${i === activeIdx ? ' active' : ''}" data-idx="${i}">
      <span class="item-num">${i + 1}</span>
      <div>
        <div class="item-label">${esc(it.title)}</div>
        ${it.vid ? '<div class="item-vid">▶ 영상 있음</div>' : ''}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => selectItem(+el.dataset.idx));
  });
}

// ── 항목 선택 ──
function selectItem(idx) {
  activeIdx = idx;
  const it = items[idx];
  document.getElementById('current-title').textContent = it.title;
  renderList(document.getElementById('search').value);
  loadVideo(it.vid);
  renderNote(it.note);
  applyMode();
  // 모바일: 사이드바 닫기
  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.add('collapsed');
    sidebarOpen = false;
  }
}

function getYTId(url) {
  if (!url) return '';
  const p = [/[?&]v=([^&#]+)/, /youtu\.be\/([^?&#]+)/, /embed\/([^?&#]+)/, /shorts\/([^?&#]+)/];
  for (const r of p) { const m = url.match(r); if (m) return m[1]; }
  return '';
}

function loadVideo(url) {
  const id = getYTId(url);
  document.getElementById('yt-frame').src = id
    ? `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`
    : 'about:blank';
}

function renderNote(md) {
  const panel = document.getElementById('notes-panel');
  if (!md || !md.trim()) {
    panel.innerHTML = '<div class="placeholder"><div class="placeholder-icon">📝</div><h3>노트 없음</h3><p>이 항목에는 노트가 없습니다.</p></div>';
    return;
  }
  panel.innerHTML = marked.parse(md);
}

// ── 모드 적용 ──
function applyMode() {
  const vp = document.getElementById('video-panel');
  const rh = document.getElementById('resize-handle');
  const np = document.getElementById('notes-panel');
  const hasVideo = activeIdx >= 0 && getYTId(items[activeIdx].vid);

  if (displayMode === 'note' || !hasVideo) {
    vp.classList.add('hidden'); rh.classList.add('hidden'); np.classList.remove('hidden');
  } else if (displayMode === 'video') {
    vp.classList.remove('hidden'); rh.classList.add('hidden'); np.classList.add('hidden');
  } else {
    vp.classList.remove('hidden'); rh.classList.remove('hidden'); np.classList.remove('hidden');
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    displayMode = btn.dataset.mode;
    applyMode();
  });
});

// ── Resize handle ──
(function() {
  const handle = document.getElementById('resize-handle');
  let drag = false, sy = 0, sp = 0;
  handle.addEventListener('mousedown', e => { drag=true; sy=e.clientY; sp=videoPct; document.body.style.userSelect='none'; document.body.style.cursor='ns-resize'; });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dy = e.clientY - sy;
    const h = document.getElementById('content-area').offsetHeight;
    videoPct = Math.max(20, Math.min(85, sp + (dy / h) * 100 * (100 / 56.25)));
    document.getElementById('yt-wrap').style.paddingTop = videoPct + '%';
  });
  window.addEventListener('mouseup', () => { if(drag){ drag=false; document.body.style.userSelect=''; document.body.style.cursor=''; } });
  // Touch
  handle.addEventListener('touchstart', e => { drag=true; sy=e.touches[0].clientY; sp=videoPct; }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (!drag) return;
    const dy = e.touches[0].clientY - sy;
    const h = document.getElementById('content-area').offsetHeight;
    videoPct = Math.max(20, Math.min(85, sp + (dy / h) * 100 * (100 / 56.25)));
    document.getElementById('yt-wrap').style.paddingTop = videoPct + '%';
  }, {passive:true});
  window.addEventListener('touchend', () => { drag=false; });
})();

// ── Sidebar ──
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}

// ── Search ──
document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

// ── Util ──
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──
loadData();
</script>
</body>
</html>
