<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video Note">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Video Note</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--border:#2e3350;
  --accent:#5b8cf7;--accent2:#7c6af7;
  --text:#e2e6f0;--text2:#8a90aa;--text3:#555b75;
  --danger:#ef4444;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);opacity:.75}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── AUTH ── */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:30px;}
.auth-card{width:100%;max-width:310px;display:flex;flex-direction:column;align-items:center;}
.auth-icon{font-size:50px;margin-bottom:12px;}
.auth-title{font-size:21px;font-weight:800;margin-bottom:5px;}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:24px;text-align:center;line-height:1.6;}
.auth-input{width:100%;padding:12px 15px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;text-align:center;letter-spacing:.15em;margin-bottom:9px;outline:none;font-family:var(--font);transition:border-color .2s;}
.auth-input:focus{border-color:var(--accent);}
.auth-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:7px;font-family:var(--font);}
.auth-btn.primary{background:var(--accent);color:#fff;}
.auth-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.auth-btn.bio{background:#1b3a1b;color:#86efac;border:1px solid #166534;}
.auth-error{color:var(--danger);font-size:12px;min-height:17px;margin-bottom:5px;text-align:center;}
.auth-panel{width:100%;display:flex;flex-direction:column;align-items:center;}
.auth-panel.hidden{display:none;}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;z-index:100;}
.loader{width:34px;height:34px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
.load-sub{font-size:13px;color:var(--text2);}
#retry-btn{display:none;padding:9px 22px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}

/* ── TOPBAR ── */
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  flex-shrink:0;min-height:48px;
}
#list-toggle-btn{
  background:none;border:1px solid var(--border);border-radius:8px;
  width:34px;height:34px;cursor:pointer;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;font-size:16px;
}
#list-toggle-btn:hover{border-color:var(--accent);color:var(--accent);}
#list-toggle-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(91,140,247,.1);}
#topbar-title{font-size:16px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#lock-btn{font-size:18px;background:none;border:none;cursor:pointer;padding:4px;opacity:.4;transition:opacity .15s;flex-shrink:0;}
#lock-btn:hover{opacity:1;}
.nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.25;cursor:not-allowed;}
.nav-btn.hidden{display:none;}

/* ── SCREENS ── */
#app{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* HOME: 카테고리 카드 그리드 */
#home-screen{flex:1;overflow-y:auto;padding:20px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.cat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px 18px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s;
  animation:fadeIn .25s ease both;
  display:flex;flex-direction:column;gap:10px;
}
.cat-card:hover{border-color:var(--accent);background:rgba(91,140,247,.07);transform:translateY(-2px);}
.cat-card-icon{font-size:28px;}
.cat-card-name{font-size:16px;font-weight:700;color:var(--text);}
.cat-card-count{font-size:13px;color:var(--text2);}

/* DEL 카드 */
.cat-card.del-card{border-style:dashed;opacity:.7;}
.cat-card.del-card:hover{border-color:var(--danger);opacity:1;}
.cat-card.del-card .cat-card-name{color:var(--text2);}

/* LIST: 카테고리 내 목록 + 콘텐츠 */
#list-screen{flex:1;display:none;overflow:hidden;}
#list-screen.show{display:flex;}

/* 사이드바 (목록) */
#item-list{
  width:300px;min-width:300px;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s,min-width .25s;
}
#item-list.collapsed{width:0;min-width:0;}
#main-menu-btn{
  width:100%;padding:11px 14px;background:none;
  border:none;border-bottom:1px solid var(--border);
  color:var(--text2);font-size:14px;font-family:var(--font);
  text-align:left;cursor:pointer;flex-shrink:0;
  transition:background .12s,color .12s;
}
#main-menu-btn:hover{background:var(--surface2);color:var(--accent);}
#list-search{padding:10px 10px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
#list-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:8px 12px;outline:none;transition:border-color .15s;}
#list-search input:focus{border-color:var(--accent);}
#list-search input::placeholder{color:var(--text3);}
#list-items{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.list-item{
  border-radius:8px;padding:11px 12px;cursor:pointer;
  margin-bottom:3px;transition:background .1s;
  display:flex;align-items:flex-start;gap:8px;border:1px solid transparent;
}
.list-item:hover{background:var(--surface2);}
.list-item.active{background:rgba(91,140,247,.15);border-color:rgba(91,140,247,.3);}
.item-num{font-size:11px;color:var(--text3);font-family:var(--mono);padding-top:2px;min-width:20px;text-align:right;flex-shrink:0;}
.item-label{font-size:14px;line-height:1.4;color:var(--text);word-break:keep-all;flex:1;}
.list-item.active .item-label{color:#a8c2ff;}

/* 삭제 목록 복원 버튼 */
.restore-btn{flex-shrink:0;padding:4px 9px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:6px;color:#22c55e;font-size:12px;cursor:pointer;font-family:var(--font);margin-top:1px;}
.restore-btn:hover{background:rgba(34,197,94,.22);}

/* 사이드바 푸터 */
#list-footer{padding:8px 12px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
#list-count{font-size:12px;color:var(--text3);}
#toggle-list-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;padding:4px 9px;cursor:pointer;font-family:var(--font);}
#toggle-list-btn:hover{border-color:var(--accent);color:var(--accent);}

/* 콘텐츠 영역 */
#content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;}

/* 영상 + 노트 PC 레이아웃 */
#video-panel{flex-shrink:0;background:#000;}
#video-panel.hidden{display:none;}
#yt-wrap{width:100%;padding-top:56.25%;position:relative;}
#yt-frame{position:absolute;inset:0;width:100%;height:100%;border:none;}
#resize-handle{height:5px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#resize-handle:hover{background:var(--surface2);}
#resize-handle::after{content:'';width:26px;height:3px;border-radius:2px;background:var(--border);}
#resize-handle.hidden{display:none;}
#notes-panel{flex:1;overflow-y:auto;padding:24px 32px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;line-height:1.8;}

/* PC 좌우 분할 */
@media(min-width:641px){
  #content-area.has-video{flex-direction:row;}
  #content-area.has-video #video-panel{width:50%;min-width:50%;flex-shrink:0;display:flex;flex-direction:column;background:#000;overflow:hidden;}
  #content-area.has-video #yt-wrap{flex:1;padding-top:0;height:100%;position:relative;}
  #content-area.has-video #yt-frame{position:absolute;inset:0;width:100%;height:100%;}
  #content-area.has-video #resize-handle{width:5px;height:auto;border-top:none;border-bottom:none;border-left:1px solid var(--border);border-right:1px solid var(--border);cursor:ew-resize;flex-direction:column;flex-shrink:0;}
  #content-area.has-video #resize-handle::after{width:3px;height:26px;}
  #content-area.has-video #notes-panel{flex:1;min-width:0;}
}

/* 빈 화면 */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);text-align:center;padding:40px;}
.placeholder-icon{font-size:38px;opacity:.35;}
.placeholder h3{font-size:15px;font-weight:500;color:var(--text2);}
.placeholder p{font-size:13px;color:var(--text3);line-height:1.6;}
.empty-list{padding:20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.7;}

/* 아이템 ⋮ 메뉴 */
#item-menu{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:1px;box-shadow:0 8px 28px rgba(0,0,0,.65);min-width:200px;}
.im-sep{height:1px;background:var(--border);margin:3px 0;}
.im-lbl{font-size:11px;color:var(--text3);padding:5px 13px 3px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.im-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--text2);padding:10px 14px;border-radius:7px;text-align:left;white-space:nowrap;font-family:var(--font);display:flex;align-items:center;gap:9px;width:100%;}
.im-btn:hover{background:var(--surface2);color:var(--text);}
.im-btn.danger{color:var(--danger);}
.im-btn.danger:hover{background:rgba(239,68,68,.1);}
.item-menu-btn{flex-shrink:0;width:24px;height:24px;border-radius:5px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s;margin-top:1px;}
.list-item:hover .item-menu-btn{opacity:1;}
.item-menu-btn:hover{color:var(--text);}

/* Markdown */
#notes-panel h1{font-size:1.5em;font-weight:700;margin:0 0 13px;color:#c8d8ff;border-bottom:1px solid var(--border);padding-bottom:8px;}
#notes-panel h2{font-size:1.17em;font-weight:600;margin:22px 0 8px;color:#b0c4ff;}
#notes-panel h3{font-size:1em;font-weight:600;margin:15px 0 6px;color:#a8b8f0;}
#notes-panel p{margin:0 0 10px;color:var(--text);}
#notes-panel ul,#notes-panel ol{margin:0 0 10px 20px;}
#notes-panel li{margin-bottom:4px;}
#notes-panel code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:.85em;padding:1px 5px;color:#b8d8f8;}
#notes-panel pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 13px;}
#notes-panel pre code{background:none;border:none;padding:0;}
#notes-panel blockquote{border-left:3px solid var(--accent);margin:0 0 10px;padding:4px 0 4px 13px;color:var(--text2);font-style:italic;}
#notes-panel table{border-collapse:collapse;width:100%;margin:0 0 13px;font-size:.9em;}
#notes-panel th,#notes-panel td{border:1px solid var(--border);padding:6px 9px;}
#notes-panel th{background:var(--surface2);color:#b0c4ff;font-weight:600;}
#notes-panel hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
#notes-panel a{color:var(--accent);text-decoration:none;}
#notes-panel strong{font-weight:600;color:#d4e0ff;}

@media(max-width:640px){
  #item-list{width:100%;min-width:100%;position:fixed;z-index:50;bottom:0;top:48px;border-right:none;border-top:1px solid var(--border);}
  #item-list.collapsed{width:0;min-width:0;top:auto;height:0;}
  #notes-panel{padding:16px 18px;}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-panel" id="pw-panel">
      <div class="auth-icon">🔒</div>
      <div class="auth-title">Video Note</div>
      <div class="auth-sub">비밀번호를 입력하세요</div>
      <input class="auth-input" id="pw-input" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
      <div class="auth-error" id="pw-error"></div>
      <button class="auth-btn primary" onclick="checkPw()">입장</button>
      <button class="auth-btn secondary" id="bio-login-btn" style="display:none" onclick="tryBiometric()">👆 지문/얼굴 인식</button>
    </div>
    <div class="auth-panel hidden" id="bio-offer-panel">
      <div class="auth-icon" style="animation:pulse 1.5s infinite">👆</div>
      <div class="auth-title">지문 등록</div>
      <div class="auth-sub">다음부터 생체 인식으로 바로 입장할 수 있습니다</div>
      <button class="auth-btn bio" onclick="registerBiometric()">👆 지문/얼굴 등록</button>
      <button class="auth-btn secondary" onclick="skipBio()">건너뛰기</button>
    </div>
    <div class="auth-panel hidden" id="bio-wait-panel">
      <div class="auth-icon" style="animation:pulse 1.5s infinite">👆</div>
      <div class="auth-title">생체 인식 중</div>
      <div class="auth-sub">기기의 지문/얼굴 인식을 사용하세요</div>
      <button class="auth-btn secondary" onclick="showPanel('pw-panel')">비밀번호로 입장</button>
    </div>
    <div class="auth-panel hidden" id="setup-panel">
      <div class="auth-icon">🔑</div>
      <div class="auth-title">비밀번호 설정</div>
      <div class="auth-sub">처음 사용합니다. 비밀번호를 설정하세요.</div>
      <input class="auth-input" id="setup-input" type="password" placeholder="새 비밀번호" onkeydown="if(event.key==='Enter')setupPw()">
      <input class="auth-input" id="setup-confirm" type="password" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter')setupPw()">
      <div class="auth-error" id="setup-error"></div>
      <button class="auth-btn primary" onclick="setupPw()">설정 완료</button>
    </div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-overlay" style="display:none">
  <div class="loader"></div>
  <div class="load-sub" id="load-msg">불러오는 중…</div>
  <button id="retry-btn" onclick="loadData()">🔄 다시 시도</button>
</div>

<!-- ITEM MENU -->
<div id="item-menu">
  <div class="im-lbl" id="im-lbl"></div>
  <div class="im-sep"></div>
  <button class="im-btn" onclick="moveItem(-1)">↑ 위로</button>
  <button class="im-btn" onclick="moveItem(1)">↓ 아래로</button>
  <div class="im-sep"></div>
  <button class="im-btn danger" onclick="deleteItem()">🗑 삭제</button>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <button id="list-toggle-btn" title="목록" style="display:none">☰</button>
  <button class="nav-btn" id="prev-btn" title="이전">◀</button>
  <button class="nav-btn" id="next-btn" title="다음">▶</button>
  <div id="topbar-title">Video Note</div>
  <button id="lock-btn" onclick="lockApp()">🔒</button>
</div>

<!-- APP -->
<div id="app">

  <!-- HOME: 카테고리 카드 -->
  <div id="home-screen">
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- LIST SCREEN -->
  <div id="list-screen">

    <!-- 사이드바 목록 -->
    <div id="item-list">
      <button id="main-menu-btn" onclick="goHome()">← 메인화면</button>
      <div id="list-search"><input type="text" id="search-input" placeholder="검색…" autocomplete="off"></div>
      <div id="list-items"></div>
      <div id="list-footer">
        <span id="list-count"></span>
        <button id="toggle-list-btn" onclick="toggleList()">목록 숨기기</button>
      </div>
    </div>

    <!-- 콘텐츠 -->
    <div id="content-area">
      <div id="video-panel" class="hidden">
        <div id="yt-wrap">
          <iframe id="yt-frame" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>
        </div>
      </div>
      <div id="resize-handle" class="hidden"></div>
      <div id="notes-panel">
        <div class="placeholder">
          <div class="placeholder-icon">📋</div>
          <h3>항목을 선택하세요</h3>
        </div>
      </div>
    </div>

  </div><!-- /list-screen -->

</div><!-- /app -->

<script>
// ════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════
const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlEaEIaiAMhCcEAsxlTV_CKEOzEaTlNBNeE80gBaxHhsrFQ1LdM-oJod1Hq_N-qjF2a1TxvDCHAOlK/pub?gid=0&single=true&output=csv';
const K_PW  = 'esl_pw';
const K_BIO = 'esl_bio';
const K_ORG = 'vn_org';  // {order:[idx,...], deleted:[idx,...]}

// ════════════════════════════════════════
//  STATE
// ════════════════════════════════════════
let sheetItems  = [];
let org         = {order:[], deleted:[]};
let activeCat   = '';   // 현재 카테고리
let activeSIdx  = -1;
let listVisible = true;
let videoPct    = 56.25;
let videoPctH   = 50;
let menuTargetSIdx = -1;

// ════════════════════════════════════════
//  STORAGE
// ════════════════════════════════════════
function loadOrg(){
  try{const d=JSON.parse(localStorage.getItem(K_ORG)||'null');org=d&&Array.isArray(d.order)?d:{order:[],deleted:[]}}
  catch(e){org={order:[],deleted:[]};}
}
function saveOrg(){localStorage.setItem(K_ORG,JSON.stringify(org));}
function syncOrg(){
  sheetItems.forEach((_,i)=>{if(!org.order.includes(i)&&!org.deleted.includes(i))org.order.push(i);});
  org.order=org.order.filter(i=>i<sheetItems.length);
  org.deleted=org.deleted.filter(i=>i<sheetItems.length);
  saveOrg();
}

// ════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════
function hashPw(pw){let h=0;for(let i=0;i<pw.length;i++)h=(Math.imul(31,h)+pw.charCodeAt(i))|0;return h.toString(36);}
function showPanel(id){['pw-panel','bio-offer-panel','bio-wait-panel','setup-panel'].forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==id));}
function checkPw(){
  const pw=document.getElementById('pw-input').value,stored=localStorage.getItem(K_PW);
  if(!stored)return;
  if(hashPw(pw)===stored){document.getElementById('pw-input').value='';enterApp();}
  else{const e=document.getElementById('pw-error');e.textContent='비밀번호가 틀렸습니다.';setTimeout(()=>e.textContent='',2000);}
}
function setupPw(){
  const pw=document.getElementById('setup-input').value,pw2=document.getElementById('setup-confirm').value,e=document.getElementById('setup-error');
  if(pw.length<4){e.textContent='4자 이상 입력하세요.';return;}
  if(pw!==pw2){e.textContent='비밀번호가 일치하지 않습니다.';return;}
  localStorage.setItem(K_PW,hashPw(pw));
  document.getElementById('setup-input').value='';document.getElementById('setup-confirm').value='';
  if(window.PublicKeyCredential)showPanel('bio-offer-panel');else enterApp();
}
async function registerBiometric(){
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Video Note'},user:{id:new Uint8Array(16),name:'user',displayName:'User'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{userVerification:'required'},timeout:60000}});
    localStorage.setItem(K_BIO,'true');localStorage.setItem('vn_cred_id',btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));enterApp();
  }catch(e){enterApp();}
}
async function tryBiometric(){
  showPanel('bio-wait-panel');
  try{
    const rawId=Uint8Array.from(atob(localStorage.getItem('vn_cred_id')||''),c=>c.charCodeAt(0));
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:rawId}],userVerification:'required',timeout:60000}});
    enterApp();
  }catch(e){showPanel('pw-panel');}
}
function skipBio(){enterApp();}
function enterApp(){document.getElementById('auth-screen').style.display='none';loadOrg();loadData();}
function lockApp(){document.getElementById('auth-screen').style.display='flex';showPanel('pw-panel');document.getElementById('pw-input').value='';document.getElementById('pw-input').focus();}
function initAuth(){
  const stored=localStorage.getItem(K_PW);
  if(!stored){showPanel('setup-panel');return;}
  if(localStorage.getItem(K_BIO)==='true'&&window.PublicKeyCredential){document.getElementById('bio-login-btn').style.display='';tryBiometric();}
  else{showPanel('pw-panel');document.getElementById('pw-input').focus();}
}

// ════════════════════════════════════════
//  CSV
// ════════════════════════════════════════
function parseCSV(t){
  t=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[];let cur=[],cell='',inQ=false;
  for(let i=0;i<t.length;i++){const ch=t[i],nx=t[i+1];if(inQ){if(ch==='"'&&nx==='"'){cell+='"';i++;}else if(ch==='"')inQ=false;else cell+=ch;}else{if(ch==='"')inQ=true;else if(ch===','){cur.push(cell);cell='';}else if(ch==='\n'){cur.push(cell);cell='';if(cur.some(c=>c))rows.push(cur);cur=[];}else cell+=ch;}}
  cur.push(cell);if(cur.some(c=>c))rows.push(cur);
  if(!rows.length)return[];
  const h=rows[0].map(k=>k.trim().toLowerCase());
  return rows.slice(1).map(r=>{const o={};h.forEach((k,j)=>o[k]=(r[j]||'').trim());return o;});
}

// ════════════════════════════════════════
//  LOAD
// ════════════════════════════════════════
async function loadData(){
  const ov=document.getElementById('loading-overlay'),msg=document.getElementById('load-msg'),rb=document.getElementById('retry-btn');
  ov.style.display='flex';rb.style.display='none';msg.textContent='불러오는 중…';
  try{
    const resp=await fetch(SHEETS_URL+'&t='+Date.now());
    if(!resp.ok)throw new Error('응답 오류');
    const rows=parseCSV(await resp.text());
    sheetItems=rows.filter(r=>r.title).map(r=>({title:r.title,vid:r.vid||'',note:r.note||'',cat:(r.cat||r.category||'').trim()}));
    if(!sheetItems.length)throw new Error('항목 없음');
    syncOrg();
    ov.style.display='none';
    goHome();
  }catch(e){msg.textContent='❌ '+e.message;rb.style.display='block';}
}

// ════════════════════════════════════════
//  HOME: 카테고리 카드
// ════════════════════════════════════════
const CAT_ICONS = ['📚','🎬','✈️','🗣️','📝','🎯','💡','🔤','🌍','🎵','🏃','💼','🧠','🎤','📖'];
function getCatIcon(name,idx){return CAT_ICONS[idx % CAT_ICONS.length];}

function goHome(){
  activeCat='';activeSIdx=-1;
  document.getElementById('home-screen').style.display='block';
  document.getElementById('list-screen').classList.remove('show');
  document.getElementById('list-toggle-btn').style.display='none';
  document.getElementById('prev-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('topbar-title').textContent='Video Note';
  document.getElementById('yt-frame').src='about:blank';
  history.replaceState({page:'home'}, '');
  renderHome();
}

function renderHome(){
  const grid=document.getElementById('cat-grid');
  const activeIdxs=new Set(org.order);
  // 카테고리 수집 (순서 유지)
  const seen=new Set(),cats=[];
  org.order.forEach(i=>{const c=sheetItems[i]?.cat||'';if(c&&!seen.has(c)){seen.add(c);cats.push(c);}});
  // 카테고리 없는 항목
  const nocat=org.order.filter(i=>!sheetItems[i]?.cat);

  let html='';
  cats.forEach((cat,i)=>{
    const count=org.order.filter(j=>sheetItems[j]?.cat===cat).length;
    html+=`<div class="cat-card" data-cat="${esc(cat)}" style="animation-delay:${i*0.04}s">
      <div class="cat-card-icon">${getCatIcon(cat,i)}</div>
      <div class="cat-card-name">${esc(cat)}</div>
      <div class="cat-card-count">${count}개</div>
    </div>`;
  });
  if(nocat.length){
    html+=`<div class="cat-card" data-cat="__nocat__" style="animation-delay:${cats.length*0.04}s">
      <div class="cat-card-icon">📄</div>
      <div class="cat-card-name">미분류</div>
      <div class="cat-card-count">${nocat.length}개</div>
    </div>`;
  }
  // Del 카드
  if(org.deleted.length){
    html+=`<div class="cat-card del-card" data-cat="__del__" style="animation-delay:${(cats.length+1)*0.04}s">
      <div class="cat-card-icon">🗑</div>
      <div class="cat-card-name">삭제됨</div>
      <div class="cat-card-count">${org.deleted.length}개</div>
    </div>`;
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.cat-card').forEach(el=>el.addEventListener('click',()=>openCat(el.dataset.cat)));
}

// ════════════════════════════════════════
//  CATEGORY → LIST
// ════════════════════════════════════════
function openCat(cat){
  activeCat=cat;activeSIdx=-1;
  document.getElementById('home-screen').style.display='none';
  document.getElementById('list-screen').classList.add('show');
  document.getElementById('list-toggle-btn').style.display='flex';
  document.getElementById('list-toggle-btn').classList.add('active');
  document.getElementById('prev-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  const label=cat==='__del__'?'🗑 삭제됨':cat==='__nocat__'?'미분류':cat;
  document.getElementById('topbar-title').textContent=label;
  document.getElementById('notes-panel').innerHTML='<div class="placeholder"><div class="placeholder-icon">📋</div><h3>항목을 선택하세요</h3></div>';
  document.getElementById('video-panel').classList.add('hidden');
  document.getElementById('resize-handle').classList.add('hidden');
  document.getElementById('content-area').classList.remove('has-video');
  document.getElementById('yt-frame').src='about:blank';
  renderItems();
  updateNavBtns();
  // 목록 보이기
  listVisible=true;
  document.getElementById('item-list').classList.remove('collapsed');
  document.getElementById('toggle-list-btn').textContent='목록 숨기기';
  // 히스토리: 카테고리 진입 push
  history.pushState({page:'cat', cat}, '');
}

function getCatItems(){
  if(activeCat==='__del__') return org.deleted.map(i=>({sIdx:i,item:sheetItems[i]})).filter(x=>x.item);
  if(activeCat==='__nocat__') return org.order.filter(i=>!sheetItems[i]?.cat).map(i=>({sIdx:i,item:sheetItems[i]})).filter(x=>x.item);
  return org.order.filter(i=>sheetItems[i]?.cat===activeCat).map(i=>({sIdx:i,item:sheetItems[i]})).filter(x=>x.item);
}

function renderItems(filter=''){
  const container=document.getElementById('list-items');
  const q=filter.toLowerCase();
  let vis=getCatItems();
  if(q)vis=vis.filter(({item})=>item.title.toLowerCase().includes(q));
  document.getElementById('list-count').textContent=vis.length+'개';

  if(!vis.length){container.innerHTML=`<div class="empty-list">${q?'검색 결과 없음':'항목이 없습니다.'}</div>`;return;}

  if(activeCat==='__del__'){
    container.innerHTML=vis.map(({sIdx,item})=>`
      <div class="list-item">
        <div class="item-label" style="color:var(--text3)">${esc(item.title)}</div>
        <button class="restore-btn" data-sidx="${sIdx}">↩ 복원</button>
      </div>`).join('');
    container.querySelectorAll('.restore-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();restoreItem(+btn.dataset.sidx);}));
    return;
  }

  container.innerHTML=vis.map(({sIdx,item},i)=>`
    <div class="list-item${sIdx===activeSIdx?' active':''}" data-sidx="${sIdx}">
      <span class="item-num">${i+1}</span>
      <div class="item-label">${item.vid?'▶ ':''}${esc(item.title)}</div>
      <button class="item-menu-btn" data-sidx="${sIdx}">⋮</button>
    </div>`).join('');

  container.querySelectorAll('.list-item[data-sidx]').forEach(el=>el.addEventListener('click',()=>selectItem(+el.dataset.sidx)));
  container.querySelectorAll('.item-menu-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();openItemMenu(+btn.dataset.sidx,e);}));
}

// ════════════════════════════════════════
//  SELECT ITEM
// ════════════════════════════════════════
function selectItem(sIdx){
  closeItemMenu();
  activeSIdx=sIdx;
  const it=sheetItems[sIdx];
  renderItems(document.getElementById('search-input').value);
  loadVideo(it.vid);
  renderNote(it.note);
  applyLayout();
  updateNavBtns();
  // 모바일: 목록 자동 숨기기
  if(window.innerWidth<=640){
    listVisible=false;
    document.getElementById('item-list').classList.add('collapsed');
    document.getElementById('toggle-list-btn').textContent='목록 보기';
    document.getElementById('list-toggle-btn').classList.remove('active');
  }
}

function navigate(dir){
  const vis=getCatItems().map(v=>v.sIdx);
  const pos=vis.indexOf(activeSIdx);
  const next=pos+dir;
  if(next<0||next>=vis.length)return;
  selectItem(vis[next]);
}

function updateNavBtns(){
  const vis=getCatItems().map(v=>v.sIdx);
  const pos=vis.indexOf(activeSIdx);
  const prevBtn=document.getElementById('prev-btn');
  const nextBtn=document.getElementById('next-btn');
  prevBtn.disabled = pos <= 0;
  nextBtn.disabled = pos < 0 || pos >= vis.length - 1;
}

function toggleList(){
  listVisible=!listVisible;
  document.getElementById('item-list').classList.toggle('collapsed',!listVisible);
  document.getElementById('toggle-list-btn').textContent=listVisible?'목록 숨기기':'목록 보기';
  document.getElementById('list-toggle-btn').classList.toggle('active', listVisible);
}

// ════════════════════════════════════════
//  ITEM MENU
// ════════════════════════════════════════
function openItemMenu(sIdx,e){
  menuTargetSIdx=sIdx;
  const menu=document.getElementById('item-menu');
  document.getElementById('im-lbl').textContent=sheetItems[sIdx]?.title||'';
  menu.style.display='flex';
  let l=e.clientX,t=e.clientY+4;
  if(l+210>window.innerWidth)l=e.clientX-210;
  if(t+160>window.innerHeight)t=e.clientY-160;
  menu.style.left=l+'px';menu.style.top=t+'px';
}
function closeItemMenu(){document.getElementById('item-menu').style.display='none';menuTargetSIdx=-1;}

function moveItem(dir){
  if(menuTargetSIdx<0)return;
  const vis=getCatItems().map(v=>v.sIdx);
  const pos=vis.indexOf(menuTargetSIdx);
  if(pos<0)return;
  const swapPos=pos+dir;
  if(swapPos<0||swapPos>=vis.length)return;
  const ai=org.order.indexOf(vis[pos]),bi=org.order.indexOf(vis[swapPos]);
  [org.order[ai],org.order[bi]]=[org.order[bi],org.order[ai]];
  saveOrg();renderItems(document.getElementById('search-input').value);closeItemMenu();
}

function deleteItem(){
  if(menuTargetSIdx<0)return;
  org.order=org.order.filter(i=>i!==menuTargetSIdx);
  if(!org.deleted.includes(menuTargetSIdx))org.deleted.unshift(menuTargetSIdx);
  saveOrg();
  if(activeSIdx===menuTargetSIdx){
    activeSIdx=-1;
    document.getElementById('notes-panel').innerHTML='<div class="placeholder"><div class="placeholder-icon">📋</div><h3>항목을 선택하세요</h3></div>';
    applyLayout();
  }
  renderItems(document.getElementById('search-input').value);
  closeItemMenu();
}

function restoreItem(sIdx){
  org.deleted=org.deleted.filter(i=>i!==sIdx);
  if(!org.order.includes(sIdx))org.order.push(sIdx);
  saveOrg();renderItems();
  renderHome(); // 홈 카드 카운트 갱신
}

document.addEventListener('mousedown',e=>{
  if(!document.getElementById('item-menu').contains(e.target))closeItemMenu();
});

// ════════════════════════════════════════
//  VIDEO / NOTES
// ════════════════════════════════════════
function getYTId(url){if(!url)return'';const p=[/[?&]v=([^&#]+)/,/youtu\.be\/([^?&#]+)/,/embed\/([^?&#]+)/,/shorts\/([^?&#]+)/];for(const r of p){const m=url.match(r);if(m)return m[1];}return'';}
function loadVideo(url){document.getElementById('yt-frame').src=getYTId(url)?`https://www.youtube.com/embed/${getYTId(url)}?rel=0&modestbranding=1&playsinline=1`:'about:blank';}
function renderNote(md){const p=document.getElementById('notes-panel');if(!md||!md.trim()){p.innerHTML='<div class="placeholder"><div class="placeholder-icon">📝</div><h3>노트 없음</h3></div>';return;}p.innerHTML=marked.parse(md);}
function applyLayout(){
  const hasV=activeSIdx>=0&&getYTId(sheetItems[activeSIdx]?.vid||'');
  const ca=document.getElementById('content-area');
  ca.classList.toggle('has-video',!!hasV);
  document.getElementById('video-panel').classList.toggle('hidden',!hasV);
  document.getElementById('resize-handle').classList.toggle('hidden',!hasV);
}

// ════════════════════════════════════════
//  RESIZE
// ════════════════════════════════════════
(function(){
  const h=document.getElementById('resize-handle');let drag=false,sp=0,s0=0;
  function isH(){return window.innerWidth>640&&document.getElementById('content-area').classList.contains('has-video');}
  function start(p){drag=true;s0=p;sp=isH()?videoPctH:videoPct;document.body.style.userSelect='none';document.body.style.cursor=isH()?'ew-resize':'ns-resize';}
  function move(p){
    if(!drag)return;
    const ca=document.getElementById('content-area');
    if(isH()){const d=p-s0,t=ca.offsetWidth;videoPctH=Math.max(25,Math.min(75,sp+(d/t)*100));document.getElementById('video-panel').style.width=videoPctH+'%';document.getElementById('video-panel').style.minWidth=videoPctH+'%';}
    else{const d=p-s0,t=ca.offsetHeight;videoPct=Math.max(20,Math.min(85,sp+(d/t)*100*(100/56.25)));document.getElementById('yt-wrap').style.paddingTop=videoPct+'%';}
  }
  function end(){if(drag){drag=false;document.body.style.userSelect='';document.body.style.cursor='';}}
  h.addEventListener('mousedown',e=>{e.preventDefault();start(isH()?e.clientX:e.clientY);});
  window.addEventListener('mousemove',e=>move(isH()?e.clientX:e.clientY));
  window.addEventListener('mouseup',end);
  h.addEventListener('touchstart',e=>{start(isH()?e.touches[0].clientX:e.touches[0].clientY);},{passive:true});
  window.addEventListener('touchmove',e=>{if(drag)move(isH()?e.touches[0].clientX:e.touches[0].clientY);},{passive:true});
  window.addEventListener('touchend',end);
})();

// ════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(document.getElementById('auth-screen').style.display!=='none')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1);}
  if(e.key==='Escape'){if(activeCat)goHome();closeItemMenu();}
});

// ════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════
document.getElementById('search-input').addEventListener('input',e=>renderItems(e.target.value));
document.getElementById('list-toggle-btn').addEventListener('click', toggleList);
document.getElementById('prev-btn').addEventListener('click',()=>navigate(-1));
document.getElementById('next-btn').addEventListener('click',()=>navigate(1));

// 폰 뒤로가기 → 항상 홈(카드 메뉴), 스택 유지
window.addEventListener('popstate', () => {
  goHome();
  // 홈에서 다시 뒤로가기 눌러도 앱 안에 머물도록 히스토리 재push
  history.pushState({page:'home'}, '');
});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

//  INIT
// ════════════════════════════════════════
// 초기: 이전/다음 숨김 (홈 화면)
document.getElementById('prev-btn').classList.add('hidden');
document.getElementById('next-btn').classList.add('hidden');
document.getElementById('list-toggle-btn').style.display='none';
// 초기 히스토리
history.replaceState({page:'home'}, '');
initAuth();
