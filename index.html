<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ESL Video Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--border:#2e3350;
  --accent:#5b8cf7;--accent2:#7c6af7;
  --text:#e2e6f0;--text2:#8a90aa;--text3:#555b75;
  --success:#22c55e;--danger:#ef4444;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
  --sidebar-w:280px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}

/* ══ AUTH SCREEN ══ */
#auth-screen{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:30px;
}
.auth-card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:0;}
.auth-icon{font-size:52px;margin-bottom:14px;}
.auth-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:28px;text-align:center;line-height:1.6;}
.auth-input{
  width:100%;padding:13px 16px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);font-size:16px;text-align:center;letter-spacing:.15em;
  margin-bottom:10px;outline:none;font-family:var(--font);transition:border-color .2s;
}
.auth-input:focus{border-color:var(--accent);}
.auth-btn{
  width:100%;padding:13px;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;
  font-family:var(--font);transition:opacity .15s;
}
.auth-btn.primary{background:var(--accent);color:#fff;}
.auth-btn.primary:hover{opacity:.85;}
.auth-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.auth-btn.bio{background:#1b3a1b;color:#86efac;border:1px solid #166534;}
.auth-error{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px;text-align:center;}
.auth-panel{width:100%;display:flex;flex-direction:column;align-items:center;}
.auth-panel.hidden{display:none;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}

/* ══ LOADING ══ */
#loading-overlay{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:100;
}
.loader{width:36px;height:36px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-size:15px;font-weight:600;}
.load-sub{font-size:13px;color:var(--text2);}
#retry-btn{display:none;padding:10px 24px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);}

/* ══ SIDEBAR ══ */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s,min-width .25s;
}
#sidebar.collapsed{width:0;min-width:0;}
.sidebar-header{padding:14px 13px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sidebar-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;}
.sidebar-sub{font-size:11px;color:var(--text2);white-space:nowrap;}
.search-wrap{padding:9px 9px 7px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 11px;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}
#list{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.list-item{border-radius:8px;padding:9px 10px;cursor:pointer;margin-bottom:2px;transition:background .12s;display:flex;align-items:flex-start;gap:8px;border:1px solid transparent;}
.list-item:hover{background:var(--surface2);}
.list-item.active{background:rgba(91,140,247,.15);border-color:rgba(91,140,247,.3);}
.item-num{font-size:10px;color:var(--text3);font-family:var(--mono);padding-top:2px;min-width:18px;text-align:right;flex-shrink:0;}
.item-label{font-size:13px;line-height:1.4;color:var(--text);word-break:keep-all;}
.list-item.active .item-label{color:#a8c2ff;}
.item-vid{font-size:10px;color:var(--accent);margin-top:2px;}
.item-edited{font-size:10px;color:var(--accent2);margin-top:2px;}
.sidebar-footer{padding:8px 11px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.footer-count{font-size:11px;color:var(--text3);}
#reload-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;padding:4px 9px;cursor:pointer;transition:all .15s;font-family:var(--font);}
#reload-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ══ MAIN ══ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── Topbar ── */
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.tb-btn{
  background:none;border:1px solid var(--border);border-radius:7px;
  width:30px;height:30px;cursor:pointer;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;font-size:13px;
}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-btn:disabled{opacity:.3;cursor:not-allowed;}
#current-title{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.nav-group{display:flex;gap:4px;flex-shrink:0;}
.nav-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  height:30px;padding:0 10px;cursor:pointer;color:var(--text2);
  font-size:12px;font-family:var(--font);font-weight:500;
  display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;
}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
#edit-btn{
  background:none;border:1px solid var(--border);border-radius:7px;
  height:30px;padding:0 10px;cursor:pointer;color:var(--text2);
  font-size:12px;font-family:var(--font);font-weight:500;
  display:flex;align-items:center;gap:5px;transition:all .15s;flex-shrink:0;
}
#edit-btn:hover{border-color:var(--accent2);color:var(--accent2);}
#edit-btn.editing{border-color:var(--success);color:var(--success);background:rgba(34,197,94,.08);}
#lock-btn{font-size:16px;background:none;border:none;cursor:pointer;padding:4px;opacity:.5;transition:opacity .15s;flex-shrink:0;}
#lock-btn:hover{opacity:1;}

/* ══ CONTENT ══ */
#content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#video-panel{flex-shrink:0;background:#000;position:relative;}
#video-panel.hidden{display:none;}
#yt-wrap{width:100%;padding-top:56.25%;position:relative;background:#000;}
#yt-frame{position:absolute;inset:0;width:100%;height:100%;border:none;}
#resize-handle{height:5px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#resize-handle:hover{background:var(--surface2);}
#resize-handle::after{content:'';width:28px;height:3px;border-radius:2px;background:var(--border);}
#resize-handle.hidden{display:none;}

/* Notes view */
#notes-panel{flex:1;overflow-y:auto;padding:24px 34px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;line-height:1.8;}
#notes-panel.hidden{display:none;}

/* Notes editor */
#notes-editor{
  flex:1;display:none;flex-direction:column;overflow:hidden;
}
#notes-editor.show{display:flex;}
#editor-toolbar{
  padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;
}
.et-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;
  color:var(--text2);font-size:11px;padding:4px 8px;cursor:pointer;
  font-family:var(--font);transition:all .12s;
}
.et-btn:hover{border-color:var(--accent);color:var(--accent);}
.et-sep{width:1px;height:16px;background:var(--border);margin:0 2px;}
.et-hint{font-size:11px;color:var(--text3);margin-left:auto;}
#editor-textarea{
  flex:1;background:var(--bg);border:none;color:var(--text);
  font-family:var(--mono);font-size:14px;line-height:1.8;
  padding:20px 34px;resize:none;outline:none;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.editor-footer{
  padding:8px 14px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:center;flex-shrink:0;
}
.save-btn{
  padding:7px 18px;background:var(--success);border:none;border-radius:8px;
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);
}
.discard-btn{
  padding:7px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font);
}
.local-badge{
  margin-left:auto;font-size:11px;color:var(--accent2);
  background:rgba(124,106,247,.12);border:1px solid rgba(124,106,247,.3);
  border-radius:5px;padding:3px 8px;
}

/* Markdown */
#notes-panel h1{font-size:1.5em;font-weight:700;margin:0 0 14px;color:#c8d8ff;border-bottom:1px solid var(--border);padding-bottom:8px;}
#notes-panel h2{font-size:1.18em;font-weight:600;margin:24px 0 9px;color:#b0c4ff;}
#notes-panel h3{font-size:1em;font-weight:600;margin:16px 0 6px;color:#a8b8f0;}
#notes-panel p{margin:0 0 11px;color:var(--text);}
#notes-panel ul,#notes-panel ol{margin:0 0 11px 20px;}
#notes-panel li{margin-bottom:4px;}
#notes-panel code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:.86em;padding:1px 5px;color:#b8d8f8;}
#notes-panel pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 15px;overflow-x:auto;margin:0 0 14px;}
#notes-panel pre code{background:none;border:none;padding:0;}
#notes-panel blockquote{border-left:3px solid var(--accent);margin:0 0 11px;padding:4px 0 4px 14px;color:var(--text2);font-style:italic;}
#notes-panel table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:.91em;}
#notes-panel th,#notes-panel td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
#notes-panel th{background:var(--surface2);color:#b0c4ff;font-weight:600;}
#notes-panel hr{border:none;border-top:1px solid var(--border);margin:18px 0;}
#notes-panel a{color:var(--accent);text-decoration:none;}
#notes-panel strong{font-weight:600;color:#d4e0ff;}

/* Placeholder */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3);text-align:center;padding:40px;}
.placeholder-icon{font-size:42px;opacity:.4;}
.placeholder h3{font-size:15px;font-weight:500;color:var(--text2);}
.placeholder p{font-size:13px;line-height:1.6;max-width:300px;}
.empty-list{padding:20px 14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6;}

@media(max-width:640px){
  :root{--sidebar-w:100vw;}
  #sidebar{position:fixed;z-index:50;bottom:0;top:auto;height:52vh;width:100vw;min-width:100vw;border-right:none;border-top:1px solid var(--border);}
  #sidebar.collapsed{height:0;min-width:0;width:0;}
  #notes-panel,#editor-textarea{padding:14px 16px;}
}
</style>
</head>
<body>

<!-- ══ AUTH SCREEN ══ -->
<div id="auth-screen">
  <div class="auth-card">

    <!-- 비밀번호 패널 -->
    <div class="auth-panel" id="pw-panel">
      <div class="auth-icon">🔒</div>
      <div class="auth-title">ESL Video Notes</div>
      <div class="auth-sub">비밀번호를 입력하세요</div>
      <input class="auth-input" id="pw-input" type="password" placeholder="Password"
        onkeydown="if(event.key==='Enter')checkPw()">
      <div class="auth-error" id="pw-error"></div>
      <button class="auth-btn primary" onclick="checkPw()">입장</button>
      <button class="auth-btn secondary" id="bio-login-btn" style="display:none" onclick="tryBiometric()">👆 지문/얼굴 인식</button>
    </div>

    <!-- 지문 등록 제안 패널 -->
    <div class="auth-panel hidden" id="bio-offer-panel">
      <div class="auth-icon" style="animation:pulse 1.5s infinite">👆</div>
      <div class="auth-title">지문 등록</div>
      <div class="auth-sub">다음부터 비밀번호 없이<br>생체 인식으로 바로 입장할 수 있습니다</div>
      <button class="auth-btn bio" onclick="registerBiometric()">👆 지문/얼굴 등록</button>
      <button class="auth-btn secondary" onclick="skipBio()">건너뛰기</button>
    </div>

    <!-- 지문 인증 대기 패널 -->
    <div class="auth-panel hidden" id="bio-wait-panel">
      <div class="auth-icon" style="animation:pulse 1.5s infinite">👆</div>
      <div class="auth-title">생체 인식 중</div>
      <div class="auth-sub">기기의 지문/얼굴 인식을 사용하세요</div>
      <button class="auth-btn secondary" onclick="showPanel('pw-panel')">비밀번호로 입장</button>
    </div>

    <!-- 비밀번호 설정 패널 (최초 1회) -->
    <div class="auth-panel hidden" id="setup-panel">
      <div class="auth-icon">🔑</div>
      <div class="auth-title">비밀번호 설정</div>
      <div class="auth-sub">처음 사용합니다.<br>사용할 비밀번호를 설정하세요.</div>
      <input class="auth-input" id="setup-input" type="password" placeholder="새 비밀번호"
        onkeydown="if(event.key==='Enter')setupPw()">
      <input class="auth-input" id="setup-confirm" type="password" placeholder="비밀번호 확인"
        onkeydown="if(event.key==='Enter')setupPw()">
      <div class="auth-error" id="setup-error"></div>
      <button class="auth-btn primary" onclick="setupPw()">설정 완료</button>
    </div>

  </div>
</div>

<!-- ══ LOADING ══ -->
<div id="loading-overlay" style="display:none">
  <div class="loader"></div>
  <div class="load-title">ESL Video Notes</div>
  <div class="load-sub" id="load-msg">Google Sheets에서 불러오는 중…</div>
  <button id="retry-btn" onclick="loadData()">🔄 다시 시도</button>
</div>

<!-- ══ APP ══ -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo">🎬</div>
    <div>
      <div class="sidebar-title">ESL Video Notes</div>
      <div class="sidebar-sub" id="item-count">불러오는 중…</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="검색…" autocomplete="off">
  </div>
  <div id="list"><div class="empty-list">불러오는 중…</div></div>
  <div class="sidebar-footer">
    <span class="footer-count" id="footer-count"></span>
    <button id="reload-btn" onclick="loadData()">🔄 새로고침</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <!-- 사이드바 토글 -->
    <button class="tb-btn" title="목록" onclick="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="1" y1="3" x2="13" y2="3"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="11" x2="13" y2="11"/>
      </svg>
    </button>
    <!-- 이전/다음 -->
    <div class="nav-group">
      <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>‹ 이전</button>
      <button class="nav-btn" id="next-btn" onclick="navigate(1)" disabled>다음 ›</button>
    </div>
    <!-- 제목 -->
    <div id="current-title">항목을 선택하세요</div>
    <!-- 편집 버튼 -->
    <button id="edit-btn" onclick="toggleEdit()" title="노트 편집">✏️ 편집</button>
    <!-- 잠금 -->
    <button id="lock-btn" onclick="lockApp()" title="잠금">🔒</button>
  </div>

  <div id="content-area">
    <div id="video-panel" class="hidden">
      <div id="yt-wrap">
        <iframe id="yt-frame" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>
    <div id="resize-handle" class="hidden"></div>

    <!-- 노트 뷰 -->
    <div id="notes-panel">
      <div class="placeholder">
        <div class="placeholder-icon">📋</div>
        <h3>항목을 선택하세요</h3>
        <p>좌측 목록에서 강의를 선택하면<br>영상과 노트가 표시됩니다.</p>
      </div>
    </div>

    <!-- 노트 에디터 -->
    <div id="notes-editor">
      <div id="editor-toolbar">
        <button class="et-btn" onclick="ins('**','**')"><b>B</b></button>
        <button class="et-btn" onclick="ins('*','*')"><i>I</i></button>
        <button class="et-btn" onclick="insLine('## ')">H2</button>
        <button class="et-btn" onclick="insLine('### ')">H3</button>
        <div class="et-sep"></div>
        <button class="et-btn" onclick="insLine('- ')">• 목록</button>
        <button class="et-btn" onclick="insLine('> ')">인용</button>
        <button class="et-btn" onclick="ins('`','`')">코드</button>
        <button class="et-btn" onclick="insLine('---')">구분선</button>
        <span class="et-hint">마크다운 편집</span>
      </div>
      <textarea id="editor-textarea" placeholder="마크다운으로 노트를 입력하세요…" oninput="markDirty()"></textarea>
      <div class="editor-footer">
        <button class="save-btn" onclick="saveNote()">💾 저장</button>
        <button class="discard-btn" onclick="discardEdit()">취소</button>
        <span class="local-badge">📱 로컬 저장</span>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQlEaEIaiAMhCcEAsxlTV_CKEOzEaTlNBNeE80gBaxHhsrFQ1LdM-oJod1Hq_N-qjF2a1TxvDCHAOlK/pub?gid=0&single=true&output=csv";
const PW_KEY    = 'esl_pw_hash';
const NOTES_KEY = 'esl_local_notes';
const BIO_KEY   = 'esl_bio_enabled';

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let items      = [];
let activeIdx  = -1;
let sidebarOpen = true;
let videoPct   = 56.25;
let editMode   = false;
let dirty      = false;
let localNotes = {};   // {idx: markdown string}

// ════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════
function hashPw(pw) {
  // 간단한 해시 (단일 사용자, 로컬 저장)
  let h = 0;
  for (let i = 0; i < pw.length; i++) {
    h = (Math.imul(31, h) + pw.charCodeAt(i)) | 0;
  }
  return h.toString(36);
}

function showPanel(id) {
  ['pw-panel','bio-offer-panel','bio-wait-panel','setup-panel'].forEach(p => {
    document.getElementById(p).classList.toggle('hidden', p !== id);
  });
}

function checkPw() {
  const pw = document.getElementById('pw-input').value;
  const stored = localStorage.getItem(PW_KEY);
  if (!stored) return;
  if (hashPw(pw) === stored) {
    document.getElementById('pw-input').value = '';
    enterApp();
  } else {
    const err = document.getElementById('pw-error');
    err.textContent = '비밀번호가 틀렸습니다.';
    setTimeout(() => err.textContent = '', 2000);
  }
}

function setupPw() {
  const pw  = document.getElementById('setup-input').value;
  const pw2 = document.getElementById('setup-confirm').value;
  const err = document.getElementById('setup-error');
  if (pw.length < 4) { err.textContent = '4자 이상 입력하세요.'; return; }
  if (pw !== pw2)    { err.textContent = '비밀번호가 일치하지 않습니다.'; return; }
  localStorage.setItem(PW_KEY, hashPw(pw));
  document.getElementById('setup-input').value = '';
  document.getElementById('setup-confirm').value = '';
  // 지문 등록 제안
  if (window.PublicKeyCredential) showPanel('bio-offer-panel');
  else enterApp();
}

async function registerBiometric() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'ESL Video Notes' },
      user: { id: new Uint8Array(16), name: 'user', displayName: 'User' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { userVerification: 'required' },
      timeout: 60000,
    }});
    localStorage.setItem(BIO_KEY, 'true');
    localStorage.setItem('esl_cred_id', btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
    enterApp();
  } catch(e) {
    enterApp(); // 실패해도 진입
  }
}

async function tryBiometric() {
  showPanel('bio-wait-panel');
  try {
    const rawId = Uint8Array.from(atob(localStorage.getItem('esl_cred_id')||''), c => c.charCodeAt(0));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: rawId }],
      userVerification: 'required',
      timeout: 60000,
    }});
    enterApp();
  } catch(e) {
    showPanel('pw-panel');
  }
}

function skipBio() { enterApp(); }

function enterApp() {
  document.getElementById('auth-screen').style.display = 'none';
  loadNotes();
  loadData();
}

function lockApp() {
  if (dirty && !confirm('저장하지 않은 내용이 있습니다. 잠그시겠습니까?')) return;
  document.getElementById('auth-screen').style.display = 'flex';
  showPanel('pw-panel');
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-input').focus();
}

// 초기 인증 진입점
function initAuth() {
  const stored = localStorage.getItem(PW_KEY);
  if (!stored) {
    // 최초: 비밀번호 설정
    showPanel('setup-panel');
    return;
  }
  const bioEnabled = localStorage.getItem(BIO_KEY) === 'true';
  if (bioEnabled && window.PublicKeyCredential) {
    document.getElementById('bio-login-btn').style.display = '';
    tryBiometric();
  } else {
    showPanel('pw-panel');
    document.getElementById('pw-input').focus();
  }
}

// ════════════════════════════════════════════
//  LOCAL NOTES (localStorage)
// ════════════════════════════════════════════
function loadNotes() {
  try { localNotes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch(e) { localNotes = {}; }
}
function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(localNotes));
}
function getNoteForIdx(idx) {
  // 로컬 편집이 있으면 우선, 없으면 시트 원본
  return localNotes[idx] !== undefined ? localNotes[idx] : (items[idx]?.note || '');
}

// ════════════════════════════════════════════
//  CSV PARSER
// ════════════════════════════════════════════
function parseCSV(t) {
  t = t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let cur=[],cell='',inQ=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i],nx=t[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){cell+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{cell+=ch;}
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===','){cur.push(cell);cell='';}
      else if(ch==='\n'){cur.push(cell);cell='';if(cur.some(c=>c))rows.push(cur);cur=[];}
      else{cell+=ch;}
    }
  }
  cur.push(cell);if(cur.some(c=>c))rows.push(cur);
  if(!rows.length)return[];
  const h=rows[0].map(k=>k.trim().toLowerCase());
  const r=[];
  for(let i=1;i<rows.length;i++){const o={};h.forEach((k,j)=>o[k]=rows[i][j]||'');r.push(o);}
  return r;
}

// ════════════════════════════════════════════
//  DATA LOAD
// ════════════════════════════════════════════
async function loadData() {
  const overlay = document.getElementById('loading-overlay');
  const msg     = document.getElementById('load-msg');
  const retryBtn= document.getElementById('retry-btn');
  overlay.style.display = 'flex';
  retryBtn.style.display = 'none';
  msg.textContent = 'Google Sheets에서 불러오는 중…';
  try {
    const resp = await fetch(SHEETS_URL + '&t=' + Date.now());
    if (!resp.ok) throw new Error('응답 오류 ' + resp.status);
    const rows = parseCSV(await resp.text());
    if (!rows.length) throw new Error('데이터 없음');
    items = rows.filter(r => r.title).map(r => ({
      title: r.title.trim(),
      vid:   (r.vid  || '').trim(),
      note:  (r.note || '').trim()
    }));
    if (!items.length) throw new Error('유효한 항목 없음');
    document.getElementById('item-count').textContent  = items.length + '개 강의';
    document.getElementById('footer-count').textContent = items.length + '개';
    renderList();
    overlay.style.display = 'none';
    if (activeIdx >= 0) selectItem(activeIdx); // 새로고침 후 현재 항목 유지
  } catch(e) {
    msg.textContent = '❌ 불러오기 실패: ' + e.message;
    retryBtn.style.display = 'block';
  }
}

// ════════════════════════════════════════════
//  LIST
// ════════════════════════════════════════════
function renderList(filter = '') {
  const list = document.getElementById('list');
  const q = filter.toLowerCase();
  const visible = items.map((it,i) => ({it,i})).filter(({it}) => it.title.toLowerCase().includes(q));
  if (!visible.length) {
    list.innerHTML = `<div class="empty-list">${filter ? '검색 결과 없음' : '항목이 없습니다.'}</div>`;
    return;
  }
  list.innerHTML = visible.map(({it,i}) => `
    <div class="list-item${i===activeIdx?' active':''}" data-idx="${i}">
      <span class="item-num">${i+1}</span>
      <div>
        <div class="item-label">${esc(it.title)}</div>
        ${it.vid ? '<div class="item-vid">▶ 영상 있음</div>' : ''}
        ${localNotes[i]!==undefined ? '<div class="item-edited">✏ 로컬 편집됨</div>' : ''}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.list-item').forEach(el =>
    el.addEventListener('click', () => selectItem(+el.dataset.idx)));
}

// ════════════════════════════════════════════
//  SELECT ITEM
// ════════════════════════════════════════════
function selectItem(idx) {
  if (dirty && !confirm('저장하지 않은 내용이 있습니다. 이동하시겠습니까?')) return;
  if (editMode) exitEditMode(false);
  activeIdx = idx;
  const it = items[idx];
  document.getElementById('current-title').textContent = it.title;
  renderList(document.getElementById('search').value);
  loadVideo(it.vid);
  renderNote(getNoteForIdx(idx));
  applyLayout();
  updateNavBtns();
  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.add('collapsed');
    sidebarOpen = false;
  }
}

function navigate(dir) {
  const next = activeIdx + dir;
  if (next < 0 || next >= items.length) return;
  selectItem(next);
}

function updateNavBtns() {
  document.getElementById('prev-btn').disabled = activeIdx <= 0;
  document.getElementById('next-btn').disabled = activeIdx < 0 || activeIdx >= items.length - 1;
}

// ════════════════════════════════════════════
//  VIDEO
// ════════════════════════════════════════════
function getYTId(url) {
  if (!url) return '';
  const p = [/[?&]v=([^&#]+)/,/youtu\.be\/([^?&#]+)/,/embed\/([^?&#]+)/,/shorts\/([^?&#]+)/];
  for (const r of p) { const m = url.match(r); if (m) return m[1]; }
  return '';
}
function loadVideo(url) {
  const id = getYTId(url);
  // youtube.com embed (로그인 쿠키 공유, 프리미엄 적용됨)
  document.getElementById('yt-frame').src = id
    ? `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`
    : 'about:blank';
}

// ════════════════════════════════════════════
//  NOTES RENDER / EDIT
// ════════════════════════════════════════════
function renderNote(md) {
  const panel = document.getElementById('notes-panel');
  if (!md || !md.trim()) {
    panel.innerHTML = '<div class="placeholder"><div class="placeholder-icon">📝</div><h3>노트 없음</h3><p>편집 버튼으로 노트를 추가하세요.</p></div>';
    return;
  }
  panel.innerHTML = marked.parse(md);
}

function toggleEdit() {
  if (!editMode) enterEditMode();
  else exitEditMode(true);
}

function enterEditMode() {
  if (activeIdx < 0) return;
  editMode = true;
  dirty = false;
  document.getElementById('notes-panel').classList.add('hidden');
  const ed = document.getElementById('notes-editor');
  ed.classList.add('show');
  document.getElementById('editor-textarea').value = getNoteForIdx(activeIdx);
  document.getElementById('edit-btn').classList.add('editing');
  document.getElementById('edit-btn').textContent = '👁 미리보기';
  // 에디터 있을 때 리사이즈 핸들 숨기기
  document.getElementById('resize-handle').classList.add('hidden');
}

function exitEditMode(save) {
  if (save && dirty) saveNote();
  editMode = false; dirty = false;
  document.getElementById('notes-editor').classList.remove('show');
  document.getElementById('notes-panel').classList.remove('hidden');
  document.getElementById('edit-btn').classList.remove('editing');
  document.getElementById('edit-btn').textContent = '✏️ 편집';
  renderNote(getNoteForIdx(activeIdx));
  applyLayout();
}

function saveNote() {
  if (activeIdx < 0) return;
  const val = document.getElementById('editor-textarea').value;
  localNotes[activeIdx] = val;
  saveNotes();
  dirty = false;
  renderNote(val);
  renderList(document.getElementById('search').value); // 배지 업데이트
}

function discardEdit() {
  if (dirty && !confirm('변경 사항을 버리시겠습니까?')) return;
  exitEditMode(false);
}

function markDirty() { dirty = true; }

// 툴바 헬퍼
function ins(before, after) {
  const ta = document.getElementById('editor-textarea');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const rep = before + (sel || '텍스트') + after;
  ta.value = ta.value.slice(0, s) + rep + ta.value.slice(e);
  ta.selectionStart = s + before.length;
  ta.selectionEnd   = s + before.length + (sel || '텍스트').length;
  ta.focus(); markDirty();
}
function insLine(prefix) {
  const ta = document.getElementById('editor-textarea');
  const s = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
  ta.value = ta.value.slice(0, lineStart) + prefix + ta.value.slice(lineStart);
  ta.selectionStart = ta.selectionEnd = lineStart + prefix.length;
  ta.focus(); markDirty();
}

// ════════════════════════════════════════════
//  LAYOUT
// ════════════════════════════════════════════
function applyLayout() {
  const vp = document.getElementById('video-panel');
  const rh = document.getElementById('resize-handle');
  const np = document.getElementById('notes-panel');
  const hasVideo = activeIdx >= 0 && getYTId(items[activeIdx]?.vid || '');
  if (!hasVideo || editMode) {
    vp.classList.add('hidden'); rh.classList.add('hidden');
  } else {
    vp.classList.remove('hidden');
    rh.classList.remove('hidden');
  }
  if (!editMode) np.classList.remove('hidden');
}

// ════════════════════════════════════════════
//  RESIZE HANDLE
// ════════════════════════════════════════════
(function(){
  const h = document.getElementById('resize-handle');
  let drag=false, sy=0, sp=0;
  const move = y => {
    if (!drag) return;
    const dy = y - sy;
    const ch = document.getElementById('content-area').offsetHeight;
    videoPct = Math.max(20, Math.min(85, sp + (dy / ch) * 100 * (100 / 56.25)));
    document.getElementById('yt-wrap').style.paddingTop = videoPct + '%';
  };
  h.addEventListener('mousedown',  e => { drag=true; sy=e.clientY; sp=videoPct; document.body.style.userSelect='none'; document.body.style.cursor='ns-resize'; });
  window.addEventListener('mousemove', e => move(e.clientY));
  window.addEventListener('mouseup',   () => { if(drag){drag=false;document.body.style.userSelect='';document.body.style.cursor='';} });
  h.addEventListener('touchstart', e => { drag=true; sy=e.touches[0].clientY; sp=videoPct; }, {passive:true});
  window.addEventListener('touchmove', e => { if(drag) move(e.touches[0].clientY); }, {passive:true});
  window.addEventListener('touchend',  () => { drag=false; });
})();

// ════════════════════════════════════════════
//  SIDEBAR / SEARCH
// ════════════════════════════════════════════
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}
document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

// ════════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (document.getElementById('auth-screen').style.display !== 'none') return;
  if (editMode) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); navigate(-1); }
});

// ════════════════════════════════════════════
//  UTIL
// ════════════════════════════════════════════
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
initAuth();
</script>
